[MAIN]
Enabled = true
TrafficEnabled = true
ParkingEnabled = true
; Experimental: allows only newly generated moving traffic during missions.
; Parking replacement and Rockstar density adjustment always stay disabled in missions.
AllowDuringMissions = false
VerboseLogging = false
TickIntervalMs = 100
StartupGraceMs = 8000
MissionGraceMs = 8000
SummaryIntervalMs = 30000

[TRAFFIC]
MaxVehicles = 16
SpawnIntervalMs = 1800
MinSpawnDistance = 95.0
MaxSpawnDistance = 190.0
; Rural roads are sparse, so they receive a small extra node-search allowance.
RuralMaxSpawnDistance = 220.0
DespawnDistance = 360.0
; Allows dirt and mixed-surface roads in rural regions and the hills.
AllowUnpavedInRural = true
; Requires new traffic to be in the player's forward half of the world.
MinSpawnForwardDot = 0.05
; Frees slots sooner when generated traffic falls well behind the player.
BehindDespawnDistance = 170.0
BehindDespawnDot = -0.15
; Checked once during road search and again immediately before vehicle creation.
; One meter is too small for a car body; 9 meters prevents center-to-center overlap.
SpawnClearRadius = 9.0
NodeAttempts = 18
ModelAttempts = 5
ModelRequestTimeoutMs = 1200

[VARIETY]
; A model cannot normally repeat until this many other MP models have appeared.
RecentModelWindow = 24
; Reduces only Rockstar's moving traffic during free roam so MP cars are easier to see.
AdjustVanillaTraffic = true
; 1.0 is normal Rockstar traffic, while 0.55 keeps a natural but less dominant amount.
VanillaTrafficDensity = 0.55

[DRIVER]
; 786603 follows roads, stops for traffic/peds, avoids objects, and uses normal shortcuts.
DrivingStyle = 786603
Ability = 0.85
Aggressiveness = 0.10
CityMinSpeed = 10.0
CityMaxSpeed = 14.0
HighwayMinSpeed = 18.0
HighwayMaxSpeed = 23.0
FreeRoadInitialSpeed = 8.0
BlockedRoadInitialSpeed = 2.5

[WATCHDOG]
IntervalMs = 2000
StuckTimeoutMs = 20000
ProgressDistance = 2.0
ObstructionRadius = 16.0
MaxRecoveries = 2

[PARKING]
MaxVehicles = 10
ScanIntervalMs = 3500
ScanRadius = 120.0
MinSwapDistance = 35.0
DespawnDistance = 260.0
SwapChance = 0.50
MaxCandidateSpeed = 0.60
; Candidate must be behind or well to the side of the player's view.
MaxViewDot = 0.35
